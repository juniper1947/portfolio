  <script>
    (function () {
      var ticking = false;
      function updateParallax() {
        var y = window.scrollY * 0.16;
        document.body.style.setProperty(
          "--ghl-parallax-transform",
          "translate3d(0, " + y.toFixed(2) + "px, 0) scale(1.08)"
        );
        ticking = false;
      }
      window.addEventListener("scroll", function () {
        if (!ticking) {
          window.requestAnimationFrame(updateParallax);
          ticking = true;
        }
      }, { passive: true });
      updateParallax();
    })();
  </script>
