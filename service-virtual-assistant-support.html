<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Assistant Support | Junnifer Ross Uy</title>
  <meta name="description" content="Virtual Assistant Support service page." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./service-detail.css?v=1" />
  <link rel="stylesheet" href="./admin-editor.css?v=1" />
  <link rel="stylesheet" href="./image-preview-workflow.css?v=1" />
  <style>
    :root {
      --va-parallax-bg: url("https://res.cloudinary.com/dozcy2jve/image/upload/v1778744084/images/Screenshot_2026-05-14_at_3.34.36_PM_h1waey.png");
    }

    body {
      position: relative;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(180deg, rgba(255, 255, 255, 0.84) 0%, rgba(255, 255, 255, 0.88) 100%),
        var(--va-parallax-bg);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0.24;
      z-index: -1;
      pointer-events: none;
      transform: var(--va-parallax-transform, translate3d(0, 0, 0) scale(1.1));
      will-change: transform;
    }

    .samples[data-gallery="image-preview"] {
      grid-template-columns: 1fr !important;
      max-width: 980px;
      margin-left: auto;
      margin-right: auto;
    }

    .samples[data-gallery="image-preview"] .sample-media {
      aspect-ratio: 16 / 10;
      background: #fff;
    }

    .samples[data-gallery="image-preview"] .sample-media img {
      object-fit: contain;
      background: #fff;
    }
  </style>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dozcy2jve/image/upload/v1777065824/global-image-library/Portpolio_Imag_hf7ali.png" />
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Service page navigation">
      <a class="brand" href="./index.html">Junnifer Ross Uy</a>
      <a class="back-link" href="./index.html#services">Back to Service Highlights</a>
    </nav>
  </header>

  <main class="container">
    <section class="page-title" aria-labelledby="service-title">
      <h1 id="service-title">Virtual Assistant Support</h1>
      <p>Email, calendar, admin tasks, and daily workflow support.</p>
    </section>

    <section class="samples" data-gallery="image-preview" aria-label="Sample work cards"></section>
  </main>

  <dialog class="preview-lightbox" id="preview-lightbox" aria-label="Image preview">
    <div class="preview-lightbox-inner">
      <button class="preview-close-btn" id="preview-close-btn" type="button" aria-label="Close preview">×</button>
      <img id="preview-lightbox-image" src="" alt="Full size preview image" />
    </div>
  </dialog>

  <footer class="service-footer">
    <div class="container">
      <p class="footer-name">Junnifer Uy portfolio</p>
    </div>
  </footer>
  <script>
    window.pagePreviewMaxCards = 1;
    window.pagePreviewImages = [
      "https://res.cloudinary.com/dozcy2jve/image/upload/v1778746826/images/FREELANCER_nj0bjg.png"
    ];
  </script>
  <script src="./image-preview-workflow.js"></script>
  <script>
    (function () {
      var ticking = false;
      function updateParallax() {
        var y = window.scrollY * 0.16;
        document.body.style.setProperty(
          "--va-parallax-transform",
          "translate3d(0, " + y.toFixed(2) + "px, 0) scale(1.1)"
        );
        ticking = false;
      }
      window.addEventListener("scroll", function () {
        if (!ticking) {
          window.requestAnimationFrame(updateParallax);
          ticking = true;
        }
      }, { passive: true });
      updateParallax();
    })();
  </script>
  <script src="./admin-editor.js"></script>
</body>
</html>
